<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Checker</title>

<style>

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #43092a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.container {
    background: #c61717;
    padding: 25px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
}

h2 {
    margin-bottom: 20px;
}


.input-group {
    display: flex;
}

#password {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccccccdd;
    border-radius: 5px 0 0 5px;
    outline: none;
}

#togglePassword {
    padding: 10px 15px;
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
    border-radius: 0 5px 5px 0;
}

#togglePassword:hover {
    background: #0056b3;
}


.strength-container {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    margin-top: 15px;
    overflow: hidden;
}

#strengthBar {
    height: 100%;
    width: 0%;
    transition: 0.3s ease;
}
#strengthText {
    margin-top: 10px;
    font-weight: bold;
}


#tips {
    text-align: left;
    margin-top: 10px;
    color: #555;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Password Strength Checker</h2>

    <div class="input-group">
        <input type="password" id="password" placeholder="Enter Password">
        <button id="togglePassword">Show</button>
    </div>

    <div class="strength-container">
        <div id="strengthBar"></div>
    </div>

    <p id="strengthText"></p>
    <ul id="tips"></ul>
</div>

<script>



const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("togglePassword");
const strengthText = document.getElementById("strengthText");
const strengthBar = document.getElementById("strengthBar");
const tipsBox = document.getElementById("tips");

passwordInput.addEventListener("input", evaluatePassword);

toggleBtn.addEventListener("click", () => {
    passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
    toggleBtn.textContent =
        passwordInput.type === "password" ? "Show" : "Hide";
});

function evaluatePassword() {

    if (passwordInput.value.length === 0) {
        resetUI();
        return;
    }

    let score = 0;
    const pwd = passwordInput.value;

    if (pwd.length >= 8) score++;
    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
    if (/\d/.test(pwd)) score++;
    if (/[!@#$%^&*()_+{}[\]:;<>,.?~]/.test(pwd)) score++;
    if (!/(.)\1{2,}|123|abc|password|qwerty/i.test(pwd)) score++;

    updateStrengthUI(score);
}


function updateStrengthUI(score) {

    if (passwordInput.value.length < 4) {
        strengthText.textContent = "Too Short";
        strengthBar.style.width = "10%";
        strengthBar.style.background = "red";
        return;
    }

    if (score <= 2) {
        strengthText.textContent = "Weak";
        strengthBar.style.width = "30%";
        strengthBar.style.background = "red";
    }
    else if (score <= 4) {
        strengthText.textContent = "Medium";
        strengthBar.style.width = "60%";
        strengthBar.style.background = "orange";
    }
    else {
        strengthText.textContent = "Strong";
        strengthBar.style.width = "100%";
        strengthBar.style.background = "green";
    }

    showTips(score);
}


function showTips(score) {
    tipsBox.innerHTML = "";

    if (score < 5) {
        tipsBox.innerHTML += "<li>Use at least 8 characters</li>";
        tipsBox.innerHTML += "<li>Add uppercase & lowercase letters</li>";
        tipsBox.innerHTML += "<li>Include numbers</li>";
        tipsBox.innerHTML += "<li>Add special symbols</li>";
    }
}


function resetUI() {
    strengthText.textContent = "";
    strengthBar.style.width = "0%";
    strengthBar.style.background = "";
    tipsBox.innerHTML = "";
}


</script>

</body>
</html>
